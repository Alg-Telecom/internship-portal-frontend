# Nginx config for the production frontend image (see Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: any unknown path (e.g. /admin/users on reload) serves
  # index.html, and the app shows the right page.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite puts a content hash in asset file names, so they can be cached for long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
